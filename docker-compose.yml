# نشر موقع اختبار تحديد المستوى على test-english.centrefocus.ma
#
# الحاوية لا تُنشر على الإنترنت مباشرة: المنفذان 80/443 يملكهما
# formationfocus-nginx الذي يخدم بقية مواقع الخادم. لذلك تستمع هذه
# الحاوية على 172.17.0.1 (بوابة جسر Docker) وهو عنوان خاص لا يُبلَغ من
# الخارج، ويمرّر إليه الـ proxy الرئيسي عبر:
#   /home/ubuntu/formationFocus/docker/nginx/conf.d/test-english.conf
#
# نفس النمط المتّبع مع todolist و 9ri3a على هذا الخادم.

services:
  web:
    image: nginx:1.27-alpine
    container_name: test-english-nginx
    restart: unless-stopped
    ports:
      - '172.17.0.1:8095:80'
    volumes:
      # المستودع مركّب كمجلد (لا كملف مفرد) حتى يلتقط nginx أي git pull
      # فوراً؛ إعداد nginx يمنع تقديم أي شيء منه عدا index.html.
      - .:/site:ro
      # Le dossier, pas le fichier : un bind-mount de fichier fige l'inode, et
      # nginx continuait de lire l'ancienne configuration après modification.
      - ./docker:/etc/nginx/conf.d:ro
