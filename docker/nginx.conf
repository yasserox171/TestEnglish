# إعداد nginx الداخلي لحاوية الموقع.
# الحاوية غير مكشوفة على الإنترنت: تستمع على 172.17.0.1:8095 فقط،
# والـ proxy الرئيسي (formationfocus-nginx) هو من يمرّر إليها الطلبات.

server {
    listen 80;
    server_name _;

    # المستودع كله مركّب هنا لا ملف الصفحة وحده: تركيب ملف مفرد في Docker
    # يثبّت الـ inode، فيبقى المعروض هو النسخة القديمة بعد أي git pull.
    # ولأن المجلد يضم .git وملفات النشر، لا نقدّم منه إلا الصفحة صراحةً.
    root /site;

    # لا تخزين للصفحة حتى يظهر أي تحديث فوراً للزوار.
    #
    # الترويسة هنا على مستوى server لا داخل location = /index.html: طلب «/»
    # يعالجه البلوك «location = /» ويقدّم الملف عبر try_files داخلياً، فلا
    # تُطبَّق عليه ترويسات بلوك آخر. وضعها هنا يجعل كل البلوكات ترثها.
    add_header Cache-Control "no-cache, must-revalidate" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
    }

    # أي مسار آخر (بما فيه .git وملفات الإعداد) محجوب.
    location / {
        return 404;
    }

    # الصفحة تحمل كل الأنماط والسكربت بداخلها، فالضغط يوفّر جزءاً كبيراً
    # من حجمها — وهو ما يهم على الاتصالات البطيئة.
    gzip on;
    gzip_min_length 1024;

    # لا حاجة لسجلات الوصول هنا: الـ proxy الرئيسي يسجّلها مسبقاً.
    access_log off;
}
