# إعداد nginx الداخلي لحاوية الموقع.
# الحاوية غير مكشوفة على الإنترنت: تستمع على 172.17.0.1:8095 فقط،
# والـ proxy الرئيسي (formationfocus-nginx) هو من يمرّر إليها الطلبات.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # الموقع ملف واحد: أي مسار يعيد نفس الصفحة بدل خطأ 404.
    location / {
        try_files $uri /index.html;
    }

    # الصفحة تحمل كل الأنماط والسكربت بداخلها، فالضغط يوفّر جزءاً كبيراً
    # من حجمها — وهو ما يهم على الاتصالات البطيئة.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript;

    # لا تخزين للصفحة نفسها حتى يظهر أي تحديث فوراً للزوار.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # لا حاجة لسجلات الوصول هنا: الـ proxy الرئيسي يسجّلها مسبقاً.
    access_log off;
}
