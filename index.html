<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E40AF">
<title>English Learning Test</title>
<meta name="description" content="Test de niveau d'anglais — Centre Focus. 10 questions, 12 minutes, résultat immédiat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* ===================================================================
   English Learning Test — Centre Focus
   Page unique, bilingue FR / AR.
   Réglages : voir CONFIG en bas du fichier (URL Google Sheets, durée).
   Questions : tableau QUESTIONS.
   =================================================================== */

/* --- 1. Jetons de couleur — thème clair ---------------------------- */
:root{
  --brand:            #1E40AF;
  --brand-bright:     #2D5BD6;
  --brand-ink:        #1B3A9E;
  --brand-soft:       #E9EFFD;
  --brand-ring:       rgba(30,64,175,.16);

  --accent:           #0E9F6E;
  --accent-soft:      #E1F5EC;

  --warn-fg:          #92400E;
  --warn-bg:          #FDF0D5;
  --danger:           #DC2626;
  --danger-soft:      #FCE9E9;
  --danger-ring:      rgba(220,38,38,.15);
  --whatsapp:         #1FAF57;

  --ground:           #F1F5FB;
  --ground-2:         #E3EAF6;
  --surface:          #FFFFFF;
  --surface-2:        #F7F9FD;
  --line:             #DCE4F2;
  --line-strong:      #BFCDE6;

  --text:             #101A2E;
  --text-soft:        #3C4C68;
  --text-muted:       #64748B;

  --shadow-sm: 0 1px 2px rgba(16,26,46,.05), 0 3px 10px rgba(16,26,46,.045);
  --shadow-md: 0 2px 6px rgba(16,26,46,.05), 0 18px 40px -22px rgba(16,26,46,.35);
  --shadow-brand: 0 10px 26px -14px rgba(30,64,175,.85);

  --r-lg: 20px;
  --r-md: 14px;

  --font-display: "Cairo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Tajawal", "Segoe UI", system-ui, -apple-system, sans-serif;

  --ease: cubic-bezier(.22,.8,.26,1);
}

/* --- 2. Thème sombre : mêmes jetons, autres valeurs ---------------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#7C9BFA; --brand-bright:#5C7EF0; --brand-ink:#8FA9FB;
    --brand-soft:#1C2946; --brand-ring:rgba(124,155,250,.22);
    --accent:#34D399; --accent-soft:#123329;
    --warn-fg:#FBBF24; --warn-bg:#3A2C10;
    --danger:#F87171; --danger-soft:#3A1A1A; --danger-ring:rgba(248,113,113,.2);
    --whatsapp:#25C362;
    --ground:#080E1B; --ground-2:#14203A; --surface:#101A2D; --surface-2:#16223A;
    --line:#253352; --line-strong:#3A4C72;
    --text:#E9EEFA; --text-soft:#BAC7DF; --text-muted:#8C9CBA;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 2px 6px rgba(0,0,0,.35), 0 20px 44px -24px rgba(0,0,0,.9);
    --shadow-brand:0 10px 26px -14px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --brand:#7C9BFA; --brand-bright:#5C7EF0; --brand-ink:#8FA9FB;
  --brand-soft:#1C2946; --brand-ring:rgba(124,155,250,.22);
  --accent:#34D399; --accent-soft:#123329;
  --warn-fg:#FBBF24; --warn-bg:#3A2C10;
  --danger:#F87171; --danger-soft:#3A1A1A; --danger-ring:rgba(248,113,113,.2);
  --whatsapp:#25C362;
  --ground:#080E1B; --ground-2:#14203A; --surface:#101A2D; --surface-2:#16223A;
  --line:#253352; --line-strong:#3A4C72;
  --text:#E9EEFA; --text-soft:#BAC7DF; --text-muted:#8C9CBA;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 6px rgba(0,0,0,.35), 0 20px 44px -24px rgba(0,0,0,.9);
  --shadow-brand:0 10px 26px -14px rgba(0,0,0,.9);
}

/* --- 3. Base ------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100%;
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  color:var(--text);
  background-color:var(--ground);
  background-image:radial-gradient(900px 520px at 50% -180px, var(--ground-2), transparent 70%);
  background-repeat:no-repeat;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none !important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}

.app{
  width:100%; max-width:600px; margin-inline:auto;
  padding-inline:16px; padding-block:24px 40px;
  display:flex; flex-direction:column; gap:18px;
}

/* --- 4. En-tête : logo + bascule de langue ------------------------- */
.brand{display:flex;align-items:center;gap:12px}
.brand__logo{
  flex:none;width:54px;height:54px;border-radius:50%;
  box-shadow:var(--shadow-brand);display:block;
}
.brand__text{flex:1;min-width:0}
.brand__name{
  font-family:var(--font-display);font-weight:800;font-size:1.18rem;
  line-height:1.25;letter-spacing:-.015em;margin:0;
  /* Le nom reste en anglais, mais s'aligne du côté du logo dans les deux
     langues : l'algorithme bidi rend déjà le texte latin de gauche à droite. */
  text-align:start;
}
.brand__tag{margin:1px 0 0;font-size:.8rem;color:var(--text-muted);line-height:1.4}

.lang{
  flex:none;display:flex;gap:2px;padding:3px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
}
.lang__btn{
  min-width:38px;padding:5px 10px;border:0;border-radius:999px;background:transparent;
  font-family:var(--font-display);font-weight:700;font-size:.82rem;
  color:var(--text-muted);cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease);
}
.lang__btn:hover{color:var(--brand-ink)}
.lang__btn.is-active{background:var(--brand);color:#fff}

/* --- 5. Carte ------------------------------------------------------ */
.card{
  position:relative;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-md);padding:26px 24px;overflow:hidden;
}
@media (max-width:430px){
  .card{padding:20px 17px;border-radius:17px}
  .app{padding-block:18px 32px}
  .brand__logo{width:46px;height:46px}
}

/* --- 6. Texte ------------------------------------------------------ */
.h1{
  font-family:var(--font-display);font-weight:800;font-size:1.55rem;
  line-height:1.3;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance;
}
.lead{margin:0;color:var(--text-soft);font-size:.97rem}

/* --- 7. Bandeau de repères ---------------------------------------- */
.facts{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin:18px 0 20px;padding:13px 10px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
}
.fact{text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.fact__num{
  font-family:var(--font-display);font-weight:800;font-size:1.14rem;
  color:var(--brand-ink);line-height:1.2;font-variant-numeric:tabular-nums;
}
.fact__label{font-size:.75rem;color:var(--text-muted);line-height:1.35}

/* --- 8. Champs ----------------------------------------------------- */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-weight:700;font-size:.88rem;color:var(--text-soft)}
.input{
  height:52px;width:100%;
  border:1.5px solid var(--line);border-radius:var(--r-md);
  background:var(--surface-2);color:var(--text);
  padding-inline:15px;font:inherit;font-size:1rem;
  transition:border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
}
.input::placeholder{color:var(--text-muted);opacity:.75}
.input:focus{
  outline:none;border-color:var(--brand);background:var(--surface);
  box-shadow:0 0 0 4px var(--brand-ring);
}
/* Le numéro reste lu de gauche à droite, quelle que soit la langue. */
.input--tel{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;letter-spacing:.02em}
[dir="rtl"] .input--tel{text-align:right}
.input.is-invalid{border-color:var(--danger)}
.input.is-invalid:focus{box-shadow:0 0 0 4px var(--danger-ring)}
.error{color:var(--danger);font-size:.81rem;font-weight:500;line-height:1.4;min-height:1.15em}

/* --- 9. Boutons ---------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:54px;padding:0 20px;width:100%;
  border:1.5px solid transparent;border-radius:var(--r-md);
  font-family:var(--font-display);font-weight:700;font-size:1rem;
  cursor:pointer;text-decoration:none;
  transition:transform .14s var(--ease), box-shadow .18s var(--ease),
             background .18s var(--ease), border-color .18s var(--ease), opacity .18s;
}
.btn svg{width:19px;height:19px;flex:none}
/* La flèche pointe vers l'avant : à droite en FR, à gauche en AR. */
[dir="rtl"] .icon-fwd{transform:scaleX(-1)}
.btn:active{transform:translateY(1px)}
.btn--primary{
  background:linear-gradient(135deg,var(--brand-bright),var(--brand));
  color:#fff;box-shadow:var(--shadow-brand);
}
.btn--primary:hover:not(:disabled){box-shadow:0 14px 30px -14px rgba(30,64,175,.95)}
.btn--ghost{background:var(--surface);border-color:var(--line-strong);color:var(--text-soft)}
.btn--ghost:hover{border-color:var(--brand);color:var(--brand-ink);background:var(--surface-2)}
.btn--wa{background:var(--whatsapp);color:#fff;box-shadow:0 10px 24px -14px rgba(31,175,87,.9)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.btn-row{grid-template-columns:1fr}}

.note{margin:12px 0 0;font-size:.79rem;color:var(--text-muted);line-height:1.5;text-align:center}

/* --- 10. Bandeau d'état du test ------------------------------------ */
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.counter{font-family:var(--font-display);font-weight:700;font-size:.93rem;color:var(--text-soft);margin:0}
.counter b{color:var(--brand-ink);font-size:1.1rem;font-variant-numeric:tabular-nums}
.timer{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand-ink);
  font-family:var(--font-display);font-weight:700;font-size:.95rem;
  transition:background .4s var(--ease), color .4s var(--ease);
}
.timer svg{width:16px;height:16px}
.timer__value{direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:.04em;min-width:3.6ch;text-align:center}
.timer.is-warn{background:var(--warn-bg);color:var(--warn-fg)}
.timer.is-danger{background:var(--danger-soft);color:var(--danger);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.timebar{position:absolute;inset-block-start:0;inset-inline:0;height:3px;background:var(--ground-2)}
.timebar__fill{
  height:100%;width:100%;
  background:linear-gradient(90deg,var(--accent),var(--brand));
  transition:width .22s linear, background .4s var(--ease);
}
.timebar__fill.is-danger{background:var(--danger)}

/* --- 11. Barre de progression -------------------------------------- */
.progress{height:8px;background:var(--ground-2);border-radius:999px;overflow:hidden;margin-bottom:20px}
.progress__bar{
  height:100%;width:10%;border-radius:999px;
  background:linear-gradient(90deg,var(--brand),var(--accent));
  transition:width .55s var(--ease);
}

/* --- 12. Question et réponses -------------------------------------- */
.quiz-body{animation:enter .4s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* L'énoncé et les réponses sont en anglais : toujours de gauche à droite. */
.qtext{
  direction:ltr;text-align:left;
  font-family:var(--font-display);font-weight:700;font-size:1.2rem;line-height:1.5;
  margin:0 0 5px;text-wrap:balance;
}
/* L'indice est traduit : il suit la direction de la page, pas celle de l'énoncé. */
.qhint{margin:0 0 16px;font-size:.82rem;color:var(--text-muted)}

.options{display:flex;flex-direction:column;gap:10px;direction:ltr}
.option{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:13px 14px;text-align:left;
  background:var(--surface-2);border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;
  transition:border-color .18s var(--ease), background .18s var(--ease),
             box-shadow .18s var(--ease), transform .14s var(--ease);
}
.option:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.option__key{
  flex:none;width:31px;height:31px;border-radius:9px;
  display:grid;place-items:center;
  background:var(--surface);border:1.5px solid var(--line);
  font-family:var(--font-display);font-weight:700;font-size:.87rem;color:var(--text-muted);
  transition:background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
}
.option__text{flex:1;min-width:0;font-size:1rem;font-weight:500;line-height:1.5;word-break:break-word}
.option.is-selected{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px var(--brand-ring)}
.option.is-selected .option__key{background:var(--brand);border-color:var(--brand);color:#fff}
.option.is-selected .option__text{color:var(--brand-ink);font-weight:700}

.quiz-nav{display:flex;gap:10px;margin-top:20px}
.quiz-nav .btn--primary{flex:1}
.quiz-nav .btn--ghost{width:auto;flex:none;padding-inline:18px}

/* --- 13. Résultat --------------------------------------------------- */
.result-head{text-align:center}
.ring{position:relative;width:168px;height:168px;margin:2px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring__track{fill:none;stroke:var(--ground-2);stroke-width:13}
/* Les dégradés SVG ne lisent pas les variables via les attributs : on passe par le CSS. */
#ringGrad .stop-a{stop-color:var(--brand)}
#ringGrad .stop-b{stop-color:var(--accent)}
.ring__value{
  fill:none;stroke:url(#ringGrad);stroke-width:13;stroke-linecap:round;
  stroke-dasharray:439.8;stroke-dashoffset:439.8;
  transition:stroke-dashoffset 1.1s var(--ease);
}
.ring__inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring__score{
  font-family:var(--font-display);font-weight:800;font-size:2.6rem;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;direction:ltr;
}
.ring__of{font-size:.8rem;color:var(--text-muted);margin-top:5px;font-weight:500}

.level{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);
  font-family:var(--font-display);font-weight:700;font-size:.84rem;margin:0 0 10px;
}
.level__dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.level__en{direction:ltr}
.praise{margin:0 auto;max-width:42ch;color:var(--text-soft);font-size:.97rem}
.timeup{
  display:block;font-size:.79rem;font-weight:700;color:var(--warn-fg);
  margin-bottom:8px;letter-spacing:.02em;
}

.receipt{
  margin:20px 0 16px;padding:2px 16px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.receipt .row:last-child{border-bottom:0}
.row__k{font-size:.85rem;color:var(--text-muted);flex:none}
.row__v{font-weight:700;font-size:.93rem;text-align:end;min-width:0;word-break:break-word}
.row__v.ltr{direction:ltr;font-variant-numeric:tabular-nums}

.sync{display:flex;align-items:center;gap:8px;justify-content:center;font-size:.78rem;color:var(--text-muted);margin:0 0 16px}
.sync__dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex:none}
.sync.is-ok .sync__dot{background:var(--accent)}
.sync.is-pending .sync__dot{background:var(--warn-fg)}

/* --- 14. Corrigé ---------------------------------------------------- */
.review{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.review summary{
  cursor:pointer;padding:13px 16px;list-style:none;
  font-family:var(--font-display);font-weight:700;font-size:.93rem;
  background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.review summary::-webkit-details-marker{display:none}
.review summary::after{content:"＋";color:var(--text-muted);font-weight:400}
.review[open] summary::after{content:"－"}
.rev{padding:14px 16px;border-top:1px solid var(--line)}
.rev__q{direction:ltr;text-align:left;font-weight:700;font-size:.93rem;margin:0 0 8px;line-height:1.5}
.rev__q b{display:inline-block;min-width:1.5em;color:var(--text-muted)}
.rev__line{display:flex;align-items:flex-start;gap:8px;font-size:.86rem;margin-top:4px;line-height:1.5}
.rev__badge{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.68rem;font-weight:700;color:#fff;margin-top:3px}
.rev__badge.ok{background:var(--accent)}
.rev__badge.no{background:var(--danger)}
.rev__ans{direction:ltr;font-weight:600;display:inline-block}
.rev__why{margin:7px 0 0;font-size:.81rem;color:var(--text-muted);line-height:1.55}

.foot{text-align:center;font-size:.76rem;color:var(--text-muted);margin:0}

/* --- 15. Mouvement réduit ------------------------------------------ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
}

/* --- 16. Impression / export PDF ----------------------------------- */
@media print{
  /* Sélecteur écrit ainsi pour l'emporter sur les règles du thème sombre. */
  :root:not([data-theme="none"]){
    --ground:#fff;--ground-2:#e6e6e6;--surface:#fff;--surface-2:#fafafa;
    --line:#cfcfcf;--text:#000;--text-soft:#222;--text-muted:#555;
    --brand:#1E40AF;--brand-ink:#1E40AF;--brand-soft:#eef2fd;
    --accent:#0E7C57;--accent-soft:#eaf6f1;
  }
  body{background:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .app{max-width:none;padding:0}
  .no-print{display:none !important}
  .card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
  .review{page-break-inside:avoid}
  .review summary{display:none}
  .rev:first-child{border-top:0}
  a{text-decoration:none;color:inherit}
}
</style>
</head>
<body>

<div class="app">

  var QUESTIONS = [

    { q: "What is the plural of “child”?",

    { q: "They ______ TV when the phone rang.",

    { q: "If it ______ tomorrow, we will stay at home.",

    { q: "I'm really interested ______ learning English.",

    { q: "What is the past form of “buy”?",

    { q: "There ______ many students in the classroom.",

      hint: { fr: "There is / There are", ar: "There is / There are" },
      why:  { fr: "students est pluriel → there are.", ar: "students جمع، فنقول there are." } }
  ];

  var LEVELS = [
    { min: 9, en: "Intermediate (B1)",
      praise: { fr: "Excellent : les bases sont solides.", ar: "ممتاز، أساسك متين." } },
    { min: 7, en: "Pre-Intermediate (A2+)",
      praise: { fr: "Très bon niveau. Révisez les temps verbaux.", ar: "مستوى جيد جداً. راجع الأزمنة." } },
    { min: 5, en: "Elementary (A2)",
      praise: { fr: "Bon départ. Revoyez les temps et les verbes irréguliers.", ar: "بداية جيدة. راجع الأزمنة والأفعال الشاذة." } },
    { min: 3, en: "Beginner (A1+)",
      praise: { fr: "À renforcer : concentrez-vous sur les bases.", ar: "يحتاج تقوية: ركّز على الأساسيات." } },
    { min: 0, en: "Beginner (A1)",
      praise: { fr: "Commencez par le vocabulaire courant.", ar: "ابدأ بالمفردات اليومية." } }
  ];

  var TOTAL = QUESTIONS.length;
  var DURATION_MS = CONFIG.durationMinutes * 60 * 1000;
  var KEYS = ["A", "B", "C", "D"];

  /* =================================================================
     Utilitaires
     ================================================================= */
  function $(id) { return document.getElementById(id); }

  function store(key, value) {
    try {
      if (value === undefined) { localStorage.removeItem(key); return true; }
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) { return false; }
  }
  function recall(key) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }

  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function clock(totalSeconds) {
    var s = Math.max(0, Math.round(totalSeconds));
    return pad(Math.floor(s / 60)) + ":" + pad(s % 60);
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }
  function replay(el) {
    el.classList.remove("quiz-body"); void el.offsetWidth; el.classList.add("quiz-body");
  }

  /* =================================================================
     Langue
     ================================================================= */
  var lang = CONFIG.defaultLang;
  function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || ""; }

  function formatDate(ts) {
    var locale = lang === "ar" ? "ar-MA-u-nu-latn" : "fr-MA";
    try {
      return new Intl.DateTimeFormat(locale, {
        year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit"
      }).format(new Date(ts));
    } catch (e) {
      var d = new Date(ts);
      return d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate());
    }
  }

  function setLang(next, skipSave) {
    lang = I18N[next] ? next : CONFIG.defaultLang;
    var dir = lang === "ar" ? "rtl" : "ltr";

    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", dir);
    var app = document.querySelector(".app");
    if (app) { app.setAttribute("dir", dir); app.setAttribute("lang", lang); }

    // Textes statiques
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
    }
    nameInput.placeholder = t("phName");
    phoneInput.placeholder = t("phPhone");
    $("timer").setAttribute("aria-label", t("rowTime"));

    // Boutons de bascule
    var btns = langSwitch.querySelectorAll(".lang__btn");
    for (var b = 0; b < btns.length; b++) {
      btns[b].classList.toggle("is-active", btns[b].dataset.lang === lang);
      btns[b].setAttribute("aria-pressed", btns[b].dataset.lang === lang ? "true" : "false");
    }

    // Écrans déjà rendus
    if (!screens.quiz.hidden) renderQuestion(false);
    if (!screens.result.hidden && lastPayload) renderResult(lastPayload);
    if (syncEl && syncEl.dataset.key) syncText.textContent = t(syncEl.dataset.key);
    refreshErrors();

    if (!skipSave) store(CONFIG.keys.lang, lang);
  }

  /* =================================================================
     État
     ================================================================= */
  var state = {
    id: "", name: "", phone: "",
    answers: new Array(TOTAL).fill(null),
    index: 0, startedAt: 0, endsAt: 0,
    finished: false, autoSubmitted: false, submittedAt: 0
  };
  var ticker = null, lastShownSecond = -1, lastPayload = null;

  function saveSession() { store(CONFIG.keys.session, state); }

  var screens = { welcome: $("screen-welcome"), quiz: $("screen-quiz"), result: $("screen-result") };
  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].hidden = (k !== name); });
    replay(screens[name]);
    if (name !== "welcome") window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* =================================================================
     1) Coordonnées
     ================================================================= */
  var form = $("infoForm"), nameInput = $("fullName"), phoneInput = $("phone");
  var nameError = $("nameError"), phoneError = $("phoneError"), startBtn = $("startBtn");
  var langSwitch = $("langSwitch");
  var nameErrKey = "", phoneErrKey = "";

  function refreshStartBtn() {
    startBtn.disabled = !(nameInput.value.trim() && phoneInput.value.trim());
  }
  function refreshErrors() {
    nameError.textContent = nameErrKey ? t(nameErrKey) : "";
    phoneError.textContent = phoneErrKey ? t(phoneErrKey) : "";
  }

  function validateName(show) {
    var value = nameInput.value.trim().replace(/\s+/g, " ");
    nameErrKey = !value ? "errName"
      : value.length < 3 ? "errNameShort"
      : /\d/.test(value) ? "errNameDigits" : "";
    if (show) { refreshErrors(); nameInput.classList.toggle("is-invalid", !!nameErrKey); }
    return nameErrKey ? null : value;
  }

  function validatePhone(show) {
    var raw = phoneInput.value.trim();
    var digits = raw.replace(/\D/g, "");
    phoneErrKey = !raw ? "errPhone"
      : !/^\+?[\d\s()-]+$/.test(raw) ? "errPhoneChars"
      : digits.length < 8 ? "errPhoneShort"
      : digits.length > 15 ? "errPhoneLong" : "";
    if (show) { refreshErrors(); phoneInput.classList.toggle("is-invalid", !!phoneErrKey); }
    return phoneErrKey ? null : (raw.charAt(0) === "+" ? "+" + digits : digits);
  }

  nameInput.addEventListener("input", function () {
    refreshStartBtn(); if (nameErrKey) validateName(true);
  });
  phoneInput.addEventListener("input", function () {
    refreshStartBtn(); if (phoneErrKey) validatePhone(true);
  });

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var name = validateName(true), phone = validatePhone(true);
    if (!name) { nameInput.focus(); return; }
    if (!phone) { phoneInput.focus(); return; }
    beginTest(name, phone);
  });

  langSwitch.addEventListener("click", function (event) {
    var btn = event.target.closest(".lang__btn");
    if (btn) setLang(btn.dataset.lang);
  });

  /* =================================================================
     2) Test
     ================================================================= */
  var counterEl = $("counter"), progressEl = $("progress"), progressBar = $("progressBar");
  var quizBody = $("quizBody"), questionText = $("questionText"), questionHint = $("questionHint");
  var optionsEl = $("options"), nextBtn = $("nextBtn"), nextLabel = $("nextLabel"), prevBtn = $("prevBtn");
  var timerEl = $("timer"), timerValue = $("timerValue"), timeBar = $("timeBar");

  function beginTest(name, phone) {
    state.id = uid();
    state.name = name;
    state.phone = phone;
    state.answers = new Array(TOTAL).fill(null);
    state.index = 0;
    state.startedAt = Date.now();
    state.endsAt = state.startedAt + DURATION_MS;
    state.finished = false;
    state.autoSubmitted = false;
    state.submittedAt = 0;
    saveSession();

    show("quiz");
    renderQuestion(false);
    startTimer();
  }

  function renderQuestion(animate) {
    var q = QUESTIONS[state.index];
    var chosen = state.answers[state.index];

    questionText.textContent = q.q;
    questionHint.textContent = q.hint[lang] || q.hint.fr;

    optionsEl.innerHTML = "";
    q.options.forEach(function (label, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option" + (chosen === i ? " is-selected" : "");
      btn.setAttribute("role", "radio");
      btn.setAttribute("aria-checked", chosen === i ? "true" : "false");
      btn.dataset.index = String(i);
      btn.innerHTML = '<span class="option__key" aria-hidden="true">' + KEYS[i] + "</span>" +
                      '<span class="option__text">' + escapeHtml(label) + "</span>";
      btn.addEventListener("click", function () { choose(i); });
      optionsEl.appendChild(btn);
    });

    counterEl.innerHTML = t("counter")
      .replace("{n}", state.index + 1)
      .replace("{total}", TOTAL);
    progressEl.setAttribute("aria-valuenow", String(state.index + 1));
    progressEl.setAttribute("aria-valuemax", String(TOTAL));
    progressBar.style.width = ((state.index + 1) / TOTAL) * 100 + "%";

    prevBtn.hidden = state.index === 0;
    prevBtn.textContent = t("prev");
    nextLabel.textContent = state.index === TOTAL - 1 ? t("finish") : t("next");
    nextBtn.disabled = chosen === null;

    if (animate !== false) replay(quizBody);
  }

  function choose(i) {
    state.answers[state.index] = i;
    saveSession();
    var nodes = optionsEl.querySelectorAll(".option");
    for (var n = 0; n < nodes.length; n++) {
      var selected = Number(nodes[n].dataset.index) === i;
      nodes[n].classList.toggle("is-selected", selected);
      nodes[n].setAttribute("aria-checked", selected ? "true" : "false");
    }
    nextBtn.disabled = false;
  }

  nextBtn.addEventListener("click", function () {
    if (state.answers[state.index] === null) return;
    if (state.index === TOTAL - 1) { finish(false); return; }
    state.index++; saveSession(); renderQuestion(true);
  });
  prevBtn.addEventListener("click", function () {
    if (state.index === 0) return;
    state.index--; saveSession(); renderQuestion(true);
  });

  optionsEl.addEventListener("keydown", function (event) {
    var nodes = Array.prototype.slice.call(optionsEl.querySelectorAll(".option"));
    var current = nodes.indexOf(document.activeElement);
    if (current === -1) return;
    var step = 0;
    if (event.key === "ArrowDown" || event.key === "ArrowRight") step = 1;
    else if (event.key === "ArrowUp" || event.key === "ArrowLeft") step = -1;
    else return;
    event.preventDefault();
    nodes[(current + step + nodes.length) % nodes.length].focus();
  });

  /* ---- Chronomètre : basé sur l'horloge réelle, pas sur les ticks ---- */
  function startTimer() {
    stopTimer(); lastShownSecond = -1; tick();
    ticker = setInterval(tick, 220);
    document.addEventListener("visibilitychange", onVisible);
  }
  function stopTimer() {
    if (ticker) { clearInterval(ticker); ticker = null; }
    document.removeEventListener("visibilitychange", onVisible);
  }
  function onVisible() { if (!document.hidden) tick(); }

  function tick() {
    var left = Math.max(0, state.endsAt - Date.now());
    var seconds = Math.ceil(left / 1000);
    if (seconds !== lastShownSecond) { lastShownSecond = seconds; timerValue.textContent = clock(seconds); }
    timeBar.style.width = (left / DURATION_MS) * 100 + "%";

    var danger = left <= 60000;
    timerEl.classList.toggle("is-warn", left <= 180000 && !danger);
    timerEl.classList.toggle("is-danger", danger);
    timeBar.classList.toggle("is-danger", danger);

    if (left <= 0) finish(true);
  }

  /* =================================================================
     3) Résultat
     ================================================================= */
  function levelFor(score) {
    for (var i = 0; i < LEVELS.length; i++) if (score >= LEVELS[i].min) return LEVELS[i];
    return LEVELS[LEVELS.length - 1];
  }

  function finish(auto) {
    if (state.finished) return;
    state.finished = true;
    state.autoSubmitted = !!auto;
    state.submittedAt = Date.now();
    stopTimer();

    var score = 0;
    var details = QUESTIONS.map(function (q, i) {
      var chosen = state.answers[i];
      var correct = chosen === q.answer;
      if (correct) score++;
      return {
        number: i + 1,
        question: q.q,
        chosen: chosen === null ? null : q.options[chosen],
        correctAnswer: q.options[q.answer],
        isCorrect: correct
      };
    });

    lastPayload = {
      id: state.id || uid(),
      name: state.name,
      phone: state.phone,
      score: score,
      total: TOTAL,
      percent: Math.round((score / TOTAL) * 100),
      level: levelFor(score).en,
      durationSeconds: Math.min(Math.round((state.submittedAt - state.startedAt) / 1000), CONFIG.durationMinutes * 60),
      autoSubmitted: !!auto,
      lang: lang,
      submittedAt: new Date(state.submittedAt).toISOString(),
      answers: details
    };

    saveSession();
    archive(lastPayload);
    renderResult(lastPayload);
    show("result");
    queueForApi(lastPayload);
  }

  function archive(payload) {
    var all = recall(CONFIG.keys.archive) || [];
    all.push(payload);
    store(CONFIG.keys.archive, all.length > 50 ? all.slice(-50) : all);
  }

  function renderResult(payload) {
    var level = levelFor(payload.score);

    $("timeUp").hidden = !payload.autoSubmitted;
    $("timeUp").textContent = t("timeUp");
    $("scoreText").textContent = payload.score + "/" + payload.total;
    $("percentText").textContent = payload.percent + "%";
    $("levelText").textContent = level.en;
    $("praiseText").textContent = level.praise[lang] || level.praise.fr;

    $("outName").textContent = payload.name;
    $("outPhone").textContent = payload.phone;
    $("outScore").textContent = payload.score + " / " + payload.total + " (" + payload.percent + "%)";
    $("outTime").textContent = clock(payload.durationSeconds);
    $("outDate").textContent = formatDate(state.submittedAt || Date.now());

    var circumference = 2 * Math.PI * 70;
    var ring = $("ringValue");
    ring.style.strokeDashoffset = String(circumference);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        ring.style.strokeDashoffset = String(circumference * (1 - payload.score / payload.total));
      });
    });

    var list = $("reviewList");
    list.innerHTML = "";
    payload.answers.forEach(function (item, i) {
      var block = document.createElement("div");
      block.className = "rev";
      var yours = item.chosen === null
        ? '<span class="rev__ans" style="color:var(--text-muted)">' + escapeHtml(t("noAnswer")) + "</span>"
        : '<span class="rev__ans">' + escapeHtml(item.chosen) + "</span>";
      block.innerHTML =
        '<p class="rev__q"><b>' + item.number + ".</b> " + escapeHtml(item.question) + "</p>" +
        '<p class="rev__line"><span class="rev__badge ' + (item.isCorrect ? "ok" : "no") + '">' +
          (item.isCorrect ? "✓" : "✕") + "</span><span>" + escapeHtml(t("yourAnswer")) + " : " + yours + "</span></p>" +
        (item.isCorrect ? "" :
          '<p class="rev__line"><span class="rev__badge ok">✓</span><span>' + escapeHtml(t("correctAnswer")) +
          ' : <span class="rev__ans">' + escapeHtml(item.correctAnswer) + "</span></span></p>") +
        '<p class="rev__why">' + escapeHtml(QUESTIONS[i].why[lang] || QUESTIONS[i].why.fr) + "</p>";
      list.appendChild(block);
    });
  }

  /* =================================================================
     Envoi vers Google Sheets (Apps Script) + file d'attente locale
     ================================================================= */
  var syncEl = $("syncStatus"), syncText = $("syncText");

  function setSync(kind, key) {
    syncEl.classList.remove("is-ok", "is-pending");
    if (kind) syncEl.classList.add(kind);
    syncEl.dataset.key = key;
    syncText.textContent = t(key);
  }

  function queueForApi(payload) {
    var queue = recall(CONFIG.keys.queue) || [];
    queue.push(payload);
    store(CONFIG.keys.queue, queue);
    flushQueue();
  }

  function postOnce(body) {
    var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, CONFIG.requestTimeoutMs) : null;
    var options = {
      method: "POST",
      // text/plain : requête « simple », donc pas de pré-vol CORS vers Apps Script.
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body),
      redirect: "follow"
    };
    if (controller) options.signal = controller.signal;

    return fetch(CONFIG.apiEndpoint, options).then(function (response) {
      if (timer) clearTimeout(timer);
      if (!response.ok) throw new Error("HTTP " + response.status);
      return true;
    }).catch(function (error) {
      if (timer) clearTimeout(timer);
      if (error && error.name === "AbortError") throw error;
      // Certaines configurations d'Apps Script empêchent de lire la réponse
      // (CORS). On renvoie alors en mode opaque : le script ignore les doublons
      // grâce au champ id.
      return fetch(CONFIG.apiEndpoint, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body)
      }).then(function () { return true; });
    });
  }

  var flushing = false;
  function flushQueue() {
    var queue = recall(CONFIG.keys.queue) || [];

    if (!CONFIG.apiEndpoint) { setSync("is-ok", "syncLocal"); return; }
    if (!queue.length) { setSync("is-ok", "syncOk"); return; }
    if (flushing) return;
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      setSync("is-pending", "syncOffline"); return;
    }

    flushing = true;
    setSync("is-pending", "syncSending");

    postOnce(queue[0]).then(function () {
      var rest = (recall(CONFIG.keys.queue) || []).slice(1);
      store(CONFIG.keys.queue, rest);
      flushing = false;
      if (rest.length) flushQueue(); else setSync("is-ok", "syncOk");
    }).catch(function () {
      flushing = false;
      setSync("is-pending", "syncRetry");
      setTimeout(flushQueue, 15000);
    });
  }
  window.addEventListener("online", flushQueue);

  /* =================================================================
     PDF / partage / reprise
     ================================================================= */
  $("pdfBtn").addEventListener("click", function () {
    var review = $("review"), wasOpen = review.open;
    review.open = true;
    window.print();
    setTimeout(function () { review.open = wasOpen; }, 600);
  });

  $("shareBtn").addEventListener("click", function () {
    if (!lastPayload) return;
    var text = t("shareText")
      .replace("{score}", lastPayload.score)
      .replace("{total}", lastPayload.total)
      .replace("{level}", lastPayload.level)
      .replace("{url}", CONFIG.shareUrl);
    if (navigator.share) {
      navigator.share({ title: "English Learning Test", text: text })
        .catch(function () { openWhatsApp(text); });
    } else { openWhatsApp(text); }
  });
  function openWhatsApp(text) {
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
  }

  $("retryBtn").addEventListener("click", function () {
    store(CONFIG.keys.session, undefined);
    state.finished = false;
    state.answers = new Array(TOTAL).fill(null);
    state.index = 0;
    nameInput.value = state.name;
    phoneInput.value = state.phone;
    nameErrKey = phoneErrKey = "";
    refreshErrors();
    nameInput.classList.remove("is-invalid");
    phoneInput.classList.remove("is-invalid");
    refreshStartBtn();
    timerEl.classList.remove("is-warn", "is-danger");
    timeBar.classList.remove("is-danger");
    timeBar.style.width = "100%";
    timerValue.textContent = clock(CONFIG.durationMinutes * 60);
    show("welcome");
  });

  /* =================================================================
     Démarrage — reprise d'une session interrompue
     ================================================================= */
  function boot() {
    $("factMinutes").textContent = String(CONFIG.durationMinutes);
    timerValue.textContent = clock(CONFIG.durationMinutes * 60);

    // Favicon dérivé du logo déjà chargé : inutile de l'embarquer deux fois.
    var logo = document.querySelector(".brand__logo");
    if (logo && logo.src) {
      var icon = document.createElement("link");
      icon.rel = "icon";
      icon.href = logo.src;
      document.head.appendChild(icon);
    }

    var savedLang = recall(CONFIG.keys.lang);
    setLang(savedLang || CONFIG.defaultLang, true);
    refreshStartBtn();

    var saved = recall(CONFIG.keys.session);
    if (!saved || !saved.startedAt) { show("welcome"); return; }

    state.id = String(saved.id || uid());
    state.name = String(saved.name || "");
    state.phone = String(saved.phone || "");
    state.answers = Array.isArray(saved.answers) && saved.answers.length === TOTAL
      ? saved.answers.map(function (a) { return (typeof a === "number" && a >= 0 && a < 4) ? a : null; })
      : new Array(TOTAL).fill(null);
    state.index = Math.min(Math.max(0, Number(saved.index) || 0), TOTAL - 1);
    state.startedAt = Number(saved.startedAt) || 0;
    state.endsAt = Number(saved.endsAt) || (state.startedAt + DURATION_MS);

    nameInput.value = state.name;
    phoneInput.value = state.phone;
    refreshStartBtn();

    if (saved.finished) { show("welcome"); return; }
    if (Date.now() >= state.endsAt) { finish(true); return; }

    show("quiz");
    renderQuestion(false);
    startTimer();
  }

  boot();
})();
</script>
</body>
</html>
